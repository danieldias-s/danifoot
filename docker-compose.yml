services:
  postgres:
    image: postgres:18-alpine
    container_name: elifoot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-elifoot_classic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - elifoot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-elifoot_classic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elifoot_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-LocalDev}
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-elifoot_classic};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123456}"
      Elifoot__AuthMode: ${ELIFOOT_AUTH_MODE:-LocalDev}
    ports:
      - "${API_PORT:-5080}:5080"

volumes:
  elifoot_pgdata:
